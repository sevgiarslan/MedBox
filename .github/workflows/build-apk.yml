name: Build APK

on:
  push:
    branches:
      - claude/home-medicine-inventory-app-d8z1iq
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medbox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MedBox-debug.apk

      - name: Publish to "latest-debug" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "MedBox (debug build)"
          body: "En son otomatik debug derlemesi. Telefonda APK dosyasına dokunup kur."
          make_latest: true
          files: app/build/outputs/apk/debug/MedBox-debug.apk
